<?xml version="1.0" encoding="UTF-8"?>
<!--
  Health app icon. Copyright (c) 2022-2026, Adel Noureddine (GPL-3.0-only).
  A heart with a pulse line, in the badge style of the other apps. The PNGs in
  icons/<size>/ are rendered from this file with tools/render_app_icon.js.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="badgeFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4566F"/>
      <stop offset="1" stop-color="#D42E4E"/>
    </linearGradient>
    <linearGradient id="heartShade" gradientUnits="userSpaceOnUse" x1="0" y1="52" x2="0" y2="214">
      <stop offset="0.55" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFDCE3"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <rect x="12" y="12" width="232" height="232" rx="50" fill="url(#badgeFill)"/>
  <path d="M 40 30 H 216" stroke="#FF9FB1" stroke-width="6" stroke-linecap="round" opacity="0.8"/>

  <!-- heart -->
  <path d="M 128 214 C 110 201 44 160 44 106 C 44 74 66 52 94 52 C 109 52 121 60 128 74 C 135 60 147 52 162 52 C 190 52 212 74 212 106 C 212 160 146 201 128 214 Z"
        fill="url(#heartShade)" stroke="#7C1631" stroke-width="9" stroke-linejoin="round"/>

  <!-- pulse -->
  <path d="M 70 136 H 97 L 108 117 L 121 164 L 136 86 L 151 156 L 159 136 H 186"
        fill="none" stroke="#D42E4E" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- badge outline -->
  <rect x="12" y="12" width="232" height="232" rx="50" fill="none" stroke="#7C1631" stroke-width="10"/>
</svg>
